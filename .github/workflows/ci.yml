name: CI CarPilot

on:
  push:
    branches: [ main, dev ]

jobs:
  tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Installer les dépendances
        run: composer install --no-progress

      - name: Lancer les tests
        run: php bin/phpunit